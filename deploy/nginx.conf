# privtr.ee — nginx (sitio estático)
# Copia los bloques que necesites. Probado como server block completo.

# 1) privacidad.me -> privtr.ee conservando el @usuario (301 permanente).
server {
    listen 443 ssl http2;
    server_name privacidad.me www.privacidad.me privtree.com www.privtree.com;

    # /@ana -> https://privtr.ee/@ana
    location ~ ^/@(?<handle>[A-Za-z0-9_-]+)/?$ {
        return 301 https://privtr.ee/@$handle;
    }
    # todo lo demás a la portada
    location / { return 301 https://privtr.ee$request_uri; }
}

# 2) www -> apex
server {
    listen 443 ssl http2;
    server_name www.privtr.ee;
    return 301 https://privtr.ee$request_uri;
}

# 3) Sitio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name privtr.ee;

    root /var/www/privtree;
    index index.html;
    charset utf-8;

    # ---- Cabeceras de seguridad -------------------------------------------
    # La CSP de <meta> en el HTML es un respaldo; esta manda y además puede
    # usar frame-ancestors, que en <meta> se ignora.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; media-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;   # legado, por si acaso

    # ---- Perfiles: /@usuario ----------------------------------------------
    # Sirve u.html con 200 (no redirección) para que la URL bonita sea la real.
    location ~ ^/@(?<handle>[A-Za-z0-9_-]{2,32})/?$ {
        try_files /u.html =404;
    }

    # Compatibilidad: /u.html?u=ana -> /@ana (canoniza la URL antigua)
    location = /u.html {
        if ($arg_u ~ ^[A-Za-z0-9_-]{2,32}$) { return 301 https://privtr.ee/@$arg_u; }
        try_files $uri =404;
    }

    # ---- Caché -------------------------------------------------------------
    # HTML corto (para poder desplegar cambios sin esperar).
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
    # Fuentes e imágenes: largas. Al cambiar el contenido, renombra el archivo.
    location ~* \.(woff2|jpg|jpeg|png|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # CSS/JS: sin hash en el nombre todavía -> caché media + revalidación.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ---- Compresión --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    # Si tienes el módulo brotli, mejor todavía:
    # brotli on; brotli_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

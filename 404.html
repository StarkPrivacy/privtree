<!--
  Doble función:
  1) Router de /@usuario en hosting estático. GitHub Pages (y cualquier host que
     sirva 404.html en rutas desconocidas) entrega este archivo para /@ana; el
     JS lee la ruta y pinta el perfil. Detrás de nginx/Apache con las reglas de
     deploy/ esto no llega a usarse porque /@ana reescribe a /u.html (200 OK).
  2) Página 404 normal para cualquier otra ruta inexistente.
  Las rutas de los assets son relativas a propósito: así funciona igual en la
  raíz del dominio que bajo un subdirectorio.
-->
<body class="bg-void min-h-screen text-mist antialiased">
<a href="#page" class="skip-link">Saltar al contenido</a>
<div id="share-bar" class="fixed top-4 right-4 z-20 flex gap-2">
  <button type="button" onclick="sharePage()" class="px-3 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs text-white backdrop-blur hover:bg-white/20 transition"><i class="fa-solid fa-share-nodes"></i> Compartir</button>
  <button type="button" onclick="copyLink()" aria-label="Copiar enlace del perfil" class="px-3 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs text-white backdrop-blur hover:bg-white/20 transition" title="Copiar enlace"><i class="fa-solid fa-link"></i></button>
</div>
<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-xl bg-panel border border-neon/30 text-sm text-white opacity-0 pointer-events-none translate-y-2">Copiado</div>
<div class="relative min-h-screen flex flex-col items-center justify-center px-4 py-14 sm:py-16">
  <main id="page" class="w-full max-w-md sm:max-w-lg text-center">
    <div class="py-16 text-steel text-sm animate-pulse">Cargando…</div>
  </main>
  <footer class="mt-12 flex flex-col items-center gap-3">
    <a href="index.html" class="cta-pill inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-white/[0.03] text-[11px] text-steel/80">
      <span class="w-1.5 h-1.5 rounded-full bg-neon/70"></span>
      Crea la tuya en <span class="text-mist font-medium">privtr.ee</span>
    </a>
  </footer>
</div>
<script src="js/vendor/qrcode.min.js"></script>
<script src="js/store.js"></script>
<script src="js/profile-view.js"></script>
<script>
(function () {
  window.__privToast = function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.remove('opacity-0', 'translate-y-2');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(function () { t.classList.add('opacity-0', 'translate-y-2'); }, 1800);
  };
  var data = PrivProfileView.mount({ containerId: 'page' });
  if (!data) {
    var bar = document.getElementById('share-bar');
    if (bar) bar.remove();
    // Ruta desconocida que no es un @usuario: 404 genérico.
    if (!PrivStore.usernameFromLocation()) {
      document.getElementById('page').innerHTML =
        '<div class="py-10 px-4">' +
          '<p class="font-mono text-[64px] leading-none font-bold text-neon/25 mb-4" aria-hidden="true">404</p>' +
          '<h1 class="text-xl font-semibold text-white mb-2">Esta página no existe</h1>' +
          '<p class="text-sm text-steel mb-7">Puede que el enlace esté mal escrito o que la página se haya movido.</p>' +
          '<div class="flex flex-col sm:flex-row gap-2.5 justify-center">' +
            '<a href="index.html" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-neon text-void text-sm font-semibold hover:bg-neon-glow transition">Ir al inicio</a>' +
            '<a href="faq.html" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl border border-white/10 text-sm text-mist hover:border-neon/40 transition">Preguntas frecuentes</a>' +
          '</div>' +
        '</div>';
      document.title = 'Página no encontrada — privtr.ee';
    }
  }
})();
</script>
</body>
</html>

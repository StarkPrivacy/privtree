<body class="bg-void text-mist font-sans antialiased min-h-screen flex flex-col">
<nav class="border-b border-white/5 px-5 h-14 flex items-center justify-between">
  <a href="index.html" class="font-semibold text-white text-sm">privtr<span class="text-neon">.ee</span></a>
  <a href="acceso.html" class="text-sm text-steel hover:text-white">Ya tengo cuenta</a>
</nav>
<main class="flex-1 flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-semibold text-white mb-2">Crear tu página</h1>
    <p class="text-sm text-steel mb-8">Elige un nombre. Luego personalizas enlaces y perfil.</p>
    <form id="f" class="space-y-4" onsubmit="return go(event)">
      <div>
        <label for="username" class="text-xs text-steel">Tu enlace</label>
        <div id="username-box" class="mt-1 flex items-center rounded-xl border border-white/10 bg-panel overflow-hidden transition-colors">
          <span class="text-steel text-sm font-mono px-3 shrink-0" aria-hidden="true">privtr.ee/@</span>
          <input id="username" name="username" type="text" required pattern="[A-Za-z0-9_-]{2,32}" maxlength="32"
            placeholder="tu-nombre" autocomplete="off" autocapitalize="none" spellcheck="false"
            aria-describedby="username-help"
            class="flex-1 bg-transparent text-white px-2 py-3 text-sm focus:outline-none min-w-0">
        </div>
        <p id="username-help" class="text-[11px] text-steel/75 mt-1.5" aria-live="polite">Letras, números y guiones. Entre 2 y 32 caracteres.</p>
      </div>
      <div>
        <label for="name" class="text-xs text-steel">Nombre visible</label>
        <input id="name" name="name" type="text" autocomplete="nickname" class="mt-1 w-full rounded-xl border border-white/10 bg-panel px-3 py-3 text-sm text-white" placeholder="Cómo quieres que te vean">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-neon text-void font-semibold text-sm hover:opacity-90 transition">Continuar al panel</button>
    </form>
    <p class="mt-6 text-xs text-steel/70 text-center">Demo local: los datos se guardan en este navegador hasta conectar el servidor real.</p>
  </div>
</main>
<script src="js/store.js"></script>
<script>
(function () {
  var input = document.getElementById('username');
  var help = document.getElementById('username-help');
  var box = document.getElementById('username-box');
  var HELP = 'Letras, números y guiones. Entre 2 y 32 caracteres.';

  function check(showEmpty) {
    var raw = input.value;
    if (!raw.trim() && !showEmpty) { return setState(null, HELP); }
    var r = PrivStore.validateUsername(raw);
    if (!r.ok) return setState(false, r.reason);
    if (PrivStore.load(r.username)) return setState(false, 'Ese nombre ya está en uso en este navegador.');
    return setState(true, 'Tu página será privtr.ee/@' + r.username);
  }
  function setState(ok, msg) {
    help.textContent = msg;
    help.className = 'text-[11px] mt-1.5 ' +
      (ok === true ? 'text-emerald-400' : ok === false ? 'text-red-400' : 'text-steel/75');
    box.style.borderColor = ok === true ? 'rgba(52,211,153,.45)'
      : ok === false ? 'rgba(248,113,113,.5)' : '';
    input.setAttribute('aria-invalid', ok === false ? 'true' : 'false');
    return ok === true;
  }

  input.addEventListener('input', function () { check(false); });
  input.addEventListener('blur', function () { check(true); });

  window.go = function (e) {
    e.preventDefault();
    var r = PrivStore.validateUsername(input.value);
    if (!r.ok) { check(true); input.focus(); return false; }
    if (PrivStore.load(r.username)) { check(true); input.focus(); return false; }
    var page = PrivStore.defaultPage(r.username);
    page.username = r.username;
    var n = document.getElementById('name').value.trim();
    if (n) page.name = n;
    PrivStore.save(page);
    location.href = 'panel.html?u=' + encodeURIComponent(r.username);
    return false;
  };

  var q = new URLSearchParams(location.search);
  if (q.get('username')) { input.value = PrivStore.sanitizeUsername(q.get('username')); check(true); }
})();
</script>
</body>
</html>
